<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#9ED2EE" />
  <title>ASTrix — Founder Settlement</title>
  <script type="module" crossorigin src="/assets/index-Bt72Pn-u.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/three-core-BA6deVFD.js">
  <link rel="modulepreload" crossorigin href="/assets/three-renderer-DcU_wr53.js">
  <link rel="stylesheet" crossorigin href="/assets/index-DNowIJtW.css">
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
  <input class="drawer-state" type="radio" name="game-panel" checked id="world-panel" aria-label="Show only world controls" />
  <input class="drawer-state build-drawer-state" type="radio" name="game-panel" id="build-drawer" aria-label="Show build panel" />
  <input class="drawer-state world-drawer-state" type="radio" name="game-panel" id="world-drawer" aria-label="Show world instead of settlement or build panel" />

  <div id="controls" role="group" aria-label="World movement and zoom controls">
    <div class="pad" role="group" aria-label="Movement">
      <button class="pb up"    data-pad="0,1"  aria-label="Move forward">▲</button>
      <button class="pb left"  data-pad="-1,0" aria-label="Move left">◀</button>
      <button class="pb down"  data-pad="0,-1" aria-label="Move back">▼</button>
      <button class="pb right" data-pad="1,0"  aria-label="Move right">▶</button>
      <button class="pb center" data-pad="0,0" aria-label="Stop">•</button>
    </div>
    <button class="pb harvest-touch" id="gather-nearest" aria-label="Gather nearest natural resource">Gather</button>
    <button class="pb jump-touch" id="jump-button" aria-label="Jump">Jump</button>
    <div class="zoomers" role="group" aria-label="Zoom">
      <button class="pb" data-zoom="in"  aria-label="Zoom in">+</button>
      <button class="pb" data-zoom="out" aria-label="Zoom out">−</button>
    </div>
  </div>
  <button id="mode-button" type="button" aria-label="Switch between walking and the builder view">Builder view</button>
  <div class="drawer-toggle" role="group" aria-label="Mobile panel">
    <label class="drawer-settlement" for="world-panel">Settlement</label>
    <label class="drawer-build" for="build-drawer">Build</label>
    <label class="drawer-world" for="world-drawer">World</label>
  </div>

</body>
</html>
