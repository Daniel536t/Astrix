<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>terrain probe</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#DCD6EC}canvas{display:block}</style>
</head>
<body>
<script type="module">
import * as THREE from '../node_modules/three/build/three.module.js';

// ---------- palette (ADB §3 / REF-001 §8) ----------
const P = {
  stoneLit:  0xEDE4D6,
  grass:     0x8E9C57,
  grassDark: 0x6C7A44,
  rust:      0xB25A3F,
  ochre:     0xC9A06A,
  canopy:    0xF0A8BE,
  canopy2:   0xF2DDC4,
  trunk:     0x5B3A38,
  water:     0x1E2A4A,
  sky:       0xDCD6EC,
  sun:       0xFFF0D8
};

const W = 72, D = 72;          // cells (1 m)
const QUANT = 0.5;             // D-008
const half = W / 2;

// ---------- heightfield ----------
const heights = new Float32Array(W * D);
function terracing(v) { return Math.round(v / QUANT) * QUANT; }
for (let z = 0; z < D; z++) {
  for (let x = 0; x < W; x++) {
    const wx = x - half, wz = z - half;
    let h = 2.0
      + 1.9 * Math.sin(wx * 0.055) * Math.cos(wz * 0.041)
      + 1.2 * Math.cos(wz * 0.075)
      + 0.8 * Math.sin((wx + wz) * 0.031)
      + 0.45 * Math.sin(wx * 0.19 + wz * 0.11);
    // lake basin, south-west
    const dx = wx + 19, dz = wz + 21;
    const d = Math.sqrt(dx * dx + dz * dz);
    if (d < 17) h = Math.min(h, -1.0 - (17 - d) * 0.10);
    heights[z * W + x] = terracing(h);
  }
}
const H = (x, z) => heights[Math.max(0, Math.min(D - 1, z)) * W + Math.max(0, Math.min(W - 1, x))];

// ---------- build terrain geometry with strata bands ----------
const pos = [], col = [], nrm = [];
const c = new THREE.Color();

function tri(a, b, cc, color, nx, ny, nz) {
  pos.push(a[0], a[1], a[2], b[0], b[1], b[2], cc[0], cc[1], cc[2]);
  c.setHex(color);
  for (let i = 0; i < 3; i++) { col.push(c.r, c.g, c.b); nrm.push(nx, ny, nz); }
}
function quad(a, b, cc, d, color, nx, ny, nz) {
  // emit with winding that agrees with the supplied normal (avoids back-face culling)
  const e1 = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
  const e2 = [cc[0] - a[0], cc[1] - a[1], cc[2] - a[2]];
  const cx = e1[1] * e2[2] - e1[2] * e2[1];
  const cy = e1[2] * e2[0] - e1[0] * e2[2];
  const cz = e1[0] * e2[1] - e1[1] * e2[0];
  if (cx * nx + cy * ny + cz * nz >= 0) { tri(a, b, cc, color, nx, ny, nz); tri(a, cc, d, color, nx, ny, nz); }
  else { tri(a, cc, b, color, nx, ny, nz); tri(a, d, cc, color, nx, ny, nz); }
}
// vertical face with strata: grass cap 0.45, rust band 0.18, stone below
function face(x0, z0, x1, z1, yBottom, yTop, nx, nz) {
  const capTop = yTop, capBot = yTop - 0.45;
  const rustBot = capBot - 0.18;
  const layers = [];
  if (yTop > capBot) layers.push([Math.max(capBot, yBottom), capTop, P.grass]);
  if (capBot > rustBot && yTop > rustBot) layers.push([Math.max(rustBot, Math.max(yBottom, rustBot)), Math.min(capBot, yTop), P.rust]);
  layers.push([yBottom, Math.min(rustBot, yTop), P.stoneLit]);
  for (const [yb, yt, color] of layers) {
    if (yt - yb < 0.001) continue;
    quad([x0, yb, z0], [x0, yt, z0], [x1, yt, z1], [x1, yb, z1], color, nx, 0, nz);
  }
}

for (let z = 0; z < D; z++) {
  for (let x = 0; x < W; x++) {
    const h = H(x, z);
    const x0 = x - half, z0 = z - half, x1 = x0 + 1, z1 = z0 + 1;
    // top quad
    quad([x0, h, z0], [x1, h, z0], [x1, h, z1], [x0, h, z1], P.grass, 0, 1, 0);
    // side quads where a neighbour is lower (or map edge)
    const hxm = H(x - 1, z), hxp = H(x + 1, z), hzm = H(x, z - 1), hzp = H(x, z + 1);
    if (hxm < h) face(x0, z0, x0, z1, hxm, h, -1, 0);
    if (hxp < h) face(x1, z0, x1, z1, hxp, h, 1, 0);
    if (hzm < h) face(x0, z0, x1, z0, hzm, h, 0, -1);
    if (hzp < h) face(x0, z1, x1, z1, hzp, h, 0, 1);
  }
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
geo.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));

// ---------- scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(P.sky);
scene.fog = new THREE.FogExp2(P.sky, 0.0065);

const camera = new THREE.PerspectiveCamera(38, 16 / 9, 0.5, 600);
const target = new THREE.Vector3(0, 1.5, 0);
const pitch = THREE.MathUtils.degToRad(40), yaw = THREE.MathUtils.degToRad(45), dist = 62;
camera.position.set(
  target.x + dist * Math.cos(pitch) * Math.sin(yaw),
  target.y + dist * Math.sin(pitch),
  target.z + dist * Math.cos(pitch) * Math.cos(yaw)
);
camera.lookAt(target);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(1600, 900);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const sun = new THREE.DirectionalLight(P.sun, 2.7);
sun.position.set(55, 35, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -55; sc.right = 55; sc.top = 55; sc.bottom = -55; sc.near = 1; sc.far = 180;
sun.shadow.bias = -0.0008;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xCFC6F0, 0x6B7350, 0.85));

const terrain = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
terrain.receiveShadow = true; terrain.castShadow = true;
scene.add(terrain);

// water — built only over submerged cells so the shoreline is the terrain's hard cut
const wpos = [], wnrm = [];
for (let z = 0; z < D; z++) {
  for (let x = 0; x < W; x++) {
    if (H(x, z) >= 0) continue;
    const x0 = x - half, z0 = z - half, x1 = x0 + 1, z1 = z0 + 1, y = -0.06;
    // CCW seen from above => normal +Y
    const v = [x0, y, z0, x0, y, z1, x1, y, z1, x0, y, z0, x1, y, z1, x1, y, z0];
    for (let i = 0; i < 6; i++) {
      wpos.push(v[i * 3], v[i * 3 + 1], v[i * 3 + 2]);
      wnrm.push(0, 1, 0);
    }
  }
}
const wgeo = new THREE.BufferGeometry();
wgeo.setAttribute('position', new THREE.Float32BufferAttribute(wpos, 3));
wgeo.setAttribute('normal', new THREE.Float32BufferAttribute(wnrm, 3));
const water = new THREE.Mesh(wgeo, new THREE.MeshLambertMaterial({
  color: P.water, transparent: true, opacity: 0.93
}));
water.receiveShadow = true;
scene.add(water);

// trees
function tree(x, z, s = 1, pink = true) {
  const g = new THREE.Group();
  const y = H(Math.round(x + half), Math.round(z + half));
  const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.5 * s, 5.2 * s, 0.5 * s),
    new THREE.MeshLambertMaterial({ color: P.trunk }));
  trunk.position.y = 2.6 * s; trunk.castShadow = true; trunk.receiveShadow = true;
  g.add(trunk);
  const boxes = [
    [0, 6.0, 0, 3.4, 1.9, 3.2],
    [1.3, 5.2, 0.4, 1.7, 1.4, 1.6],
    [-1.4, 6.6, -0.5, 1.5, 1.2, 1.4],
    [0.2, 7.4, 0.7, 1.6, 1.1, 1.5]
  ];
  for (const [bx, by, bz, sx, sy, sz] of boxes) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx * s, sy * s, sz * s),
      new THREE.MeshLambertMaterial({ color: pink ? P.canopy : P.canopy2 }));
    m.position.set(bx * s, by * s, bz * s);
    m.castShadow = true; m.receiveShadow = true;
    g.add(m);
  }
  g.position.set(x, y, z);
  scene.add(g);
}
const sp = [[-8, -6], [-4, -9], [3, -7], [7, -3], [-11, -2], [10, -10], [5, -13], [-3, -14], [12, -4], [-14, -8]];
for (let i = 0; i < sp.length; i++) tree(sp[i][0], sp[i][1], 0.8 + (i % 4) * 0.12, i % 5 !== 3);

// rocks
function rock(x, z, s) {
  const y = H(Math.round(x + half), Math.round(z + half));
  const m = new THREE.Mesh(new THREE.BoxGeometry(s, s * 0.75, s * 1.15),
    new THREE.MeshLambertMaterial({ color: P.stoneLit }));
  m.position.set(x, y + s * 0.34, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
}
[[16, 8, 2.2], [18, 5, 1.4], [14, 11, 1.0], [-16, 12, 1.8]].forEach(r => rock(...r));

let frames = 0;
function loop() {
  renderer.render(scene, camera);
  if (++frames >= 3) window.__ready = true;
  requestAnimationFrame(loop);
}
loop();
window.__probe = { camera, scene, renderer };
</script>
</body>
</html>
