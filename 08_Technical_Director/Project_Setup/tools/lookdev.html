<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>lookdev v2</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#9ED2EE}canvas{display:block}</style>
</head>
<body>
<script type="module">
// Lookdev probe for Palette v2 + day/night presets (D-011, D-014).
// Loads the ONE authoritative palette file; nothing is hard-coded here except geometry.
import * as THREE from '/08_Technical_Director/Project_Setup/node_modules/three/build/three.module.js';

const PAL_URL = '/04_Art_Director/Approved_Art_Direction/palette_v2.json';
const P = await (await fetch(PAL_URL)).json();
const M = Object.fromEntries(Object.entries(P.materials).map(([k, v]) => [k, v.hex]));

const presetName = new URLSearchParams(location.search).get('t') || 'noon';
const L = P.lighting[presetName] || P.lighting.noon;

const W = 72, D = 72, QUANT = 0.5, half = W / 2;
const heights = new Float32Array(W * D);
for (let z = 0; z < D; z++) {
  for (let x = 0; x < W; x++) {
    const wx = x - half, wz = z - half;
    let h = 2.0
      + 1.9 * Math.sin(wx * 0.055) * Math.cos(wz * 0.041)
      + 1.2 * Math.cos(wz * 0.075)
      + 0.8 * Math.sin((wx + wz) * 0.031)
      + 0.45 * Math.sin(wx * 0.19 + wz * 0.11);
    const dx = wx + 19, dz = wz + 21, d = Math.sqrt(dx * dx + dz * dz);
    if (d < 17) h = Math.min(h, -1.0 - (17 - d) * 0.10);
    heights[z * W + x] = Math.round(h / QUANT) * QUANT;
  }
}
const H = (x, z) => heights[Math.max(0, Math.min(D - 1, z)) * W + Math.max(0, Math.min(W - 1, x))];

// ---------- terrain: 3 strata bands, palette v2 ----------
const col = new THREE.Color();
const pos = [], cols = [], nrm = [];
function tri(a, b, c, hex, nx, ny, nz) {
  pos.push(...a, ...b, ...c);
  col.set(hex);
  for (let i = 0; i < 3; i++) { cols.push(col.r, col.g, col.b); nrm.push(nx, ny, nz); }
}
function quad(a, b, c, d, hex, nx, ny, nz) {
  const e1 = [b[0]-a[0], b[1]-a[1], b[2]-a[2]], e2 = [c[0]-a[0], c[1]-a[1], c[2]-a[2]];
  const cx = e1[1]*e2[2]-e1[2]*e2[1], cy = e1[2]*e2[0]-e1[0]*e2[2], cz = e1[0]*e2[1]-e1[1]*e2[0];
  if (cx*nx + cy*ny + cz*nz >= 0) { tri(a,b,c,hex,nx,ny,nz); tri(a,c,d,hex,nx,ny,nz); }
  else { tri(a,c,b,hex,nx,ny,nz); tri(a,d,c,hex,nx,ny,nz); }
}
// cut face with grass cap / ochre / rust / stone body
function face(x0, z0, x1, z1, yb, yt, nx, nz) {
  const bands = [
    [yt - 0.40, yt, M.grass_cap],
    [yt - 0.62, yt - 0.40, M.strata_ochre],
    [yt - 0.80, yt - 0.62, M.strata_rust],
    [yb, yt - 0.80, M.stone_body_a]
  ];
  for (const [b0, b1, hex] of bands) {
    const lo = Math.max(b0, yb), hi = Math.min(b1, yt);
    if (hi - lo < 0.001 || hi <= lo) continue;
    quad([x0, lo, z0], [x0, hi, z0], [x1, hi, z1], [x1, lo, z1], hex, nx, 0, nz);
  }
}
for (let z = 0; z < D; z++) {
  for (let x = 0; x < W; x++) {
    const h = H(x, z), x0 = x - half, z0 = z - half, x1 = x0 + 1, z1 = z0 + 1;
    const top = h >= 12 ? M.grass_peak : h >= 6 ? M.grass_high : M.grass_top;
    quad([x0,h,z0],[x1,h,z0],[x1,h,z1],[x0,h,z1], h < 0 ? M.sand : top, 0, 1, 0);
    const hxm = H(x-1,z), hxp = H(x+1,z), hzm = H(x,z-1), hzp = H(x,z+1);
    if (hxm < h) face(x0,z0,x0,z1,hxm,h,-1,0);
    if (hxp < h) face(x1,z0,x1,z1,hxp,h,1,0);
    if (hzm < h) face(x0,z0,x1,z0,hzm,h,0,-1);
    if (hzp < h) face(x0,z1,x1,z1,hzp,h,0,1);
  }
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
geo.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));

// ---------- water ----------
const wp = [], wn = [];
for (let z = 0; z < D; z++) for (let x = 0; x < W; x++) {
  if (H(x,z) >= 0) continue;
  const x0 = x-half, z0 = z-half, y = -0.06;
  const shade = -H(x,z) > 2.5 ? M.water_deep : M.water_shallow;
  col.set(shade);
  const v = [x0,y,z0, x0,y,z0+1, x0+1,y,z0+1, x0,y,z0, x0+1,y,z0+1, x0+1,y,z0];
  for (let i = 0; i < 6; i++) { wp.push(v[i*3],v[i*3+1],v[i*3+2]); wn.push(0,1,0); }
}
const wgeo = new THREE.BufferGeometry();
wgeo.setAttribute('position', new THREE.Float32BufferAttribute(wp, 3));
wgeo.setAttribute('normal', new THREE.Float32BufferAttribute(wn, 3));
// per-quad colour via groups is overkill; single tint per vertex would need a colour attr:
const wcol = [];
for (let i = 0; i < wp.length / 3; i++) {
  const x = wp[i*3], z = wp[i*3+2];
  const h = H(Math.round(x+half), Math.round(z+half));
  const deep = new THREE.Color(M.water_deep), sh = new THREE.Color(M.water_shallow);
  const c = sh.clone().lerp(deep, Math.min(1, Math.max(0, (-h) / 4)));
  wcol.push(c.r, c.g, c.b);
}
wgeo.setAttribute('color', new THREE.Float32BufferAttribute(wcol, 3));

// ---------- scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(L.sky);
scene.fog = new THREE.FogExp2(L.fog, L.fogDensity);

const camera = new THREE.PerspectiveCamera(38, 16/9, 0.5, 600);
const target = new THREE.Vector3(0, 2.0, 0);
const pitch = THREE.MathUtils.degToRad(40), yaw = THREE.MathUtils.degToRad(45), dist = 56;
camera.position.set(
  target.x + dist*Math.cos(pitch)*Math.sin(yaw),
  target.y + dist*Math.sin(pitch),
  target.z + dist*Math.cos(pitch)*Math.cos(yaw));
camera.lookAt(target);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(1600, 900);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = L.exposure;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const elev = THREE.MathUtils.degToRad(L.sunElevationDeg), az = THREE.MathUtils.degToRad(L.sunAzimuthDeg);
const sun = new THREE.DirectionalLight(L.sunColor, L.sunIntensity);
sun.position.set(Math.cos(elev)*Math.sin(az)*90, Math.sin(elev)*90, Math.cos(elev)*Math.cos(az)*90);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 220 });
sun.shadow.bias = -0.0008;
scene.add(sun);
scene.add(new THREE.HemisphereLight(L.hemiSky, L.hemiGround, L.hemiIntensity));

const terrain = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
terrain.receiveShadow = true; terrain.castShadow = true;
scene.add(terrain);

const water = new THREE.Mesh(wgeo, new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.25, metalness: 0.0
}));
water.receiveShadow = true;
scene.add(water);

// ---------- faceted organic trees (Styl language, REF-002) ----------
const trunkMat = new THREE.MeshLambertMaterial({ color: M.trunk, flatShading: true });
const leafMats = {
  a: new THREE.MeshLambertMaterial({ color: M.canopy_green_a, flatShading: true }),
  b: new THREE.MeshLambertMaterial({ color: M.canopy_green_b, flatShading: true }),
  c: new THREE.MeshLambertMaterial({ color: M.canopy_green_c, flatShading: true }),
  p: new THREE.MeshLambertMaterial({ color: M.canopy_pink, flatShading: true })
};
const trunkGeo = new THREE.CylinderGeometry(0.22, 0.28, 1, 6);
const blobGeo = new THREE.IcosahedronGeometry(1, 0);

function tree(x, z, s, pink) {
  const y = H(Math.round(x + half), Math.round(z + half));
  const g = new THREE.Group();
  const th = 5.0 * s;
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.scale.set(1, th, 1); trunk.position.y = th / 2;
  trunk.castShadow = true; g.add(trunk);
  const mats = pink ? [leafMats.p] : [leafMats.a, leafMats.b, leafMats.c];
  const blobs = [
    [0, th + 1.0*s, 0, 2.6*s, 1.9*s, 2.5*s],
    [1.0*s, th + 0.4*s, 0.5*s, 1.6*s, 1.3*s, 1.5*s],
    [-1.0*s, th + 1.6*s, -0.4*s, 1.5*s, 1.2*s, 1.4*s]
  ];
  blobs.forEach((b, i) => {
    const m = new THREE.Mesh(blobGeo, mats[i % mats.length]);
    m.position.set(b[0], b[1], b[2]);
    m.scale.set(b[3], b[4], b[5]);
    m.rotation.y = (i * 0.7) % (Math.PI * 2);
    m.castShadow = true; m.receiveShadow = true;
    g.add(m);
  });
  g.position.set(x, y - 0.1, z);
  scene.add(g);
}
const spots = [[-9,-6,1.0,0],[-5,-9,1.15,0],[3,-7,0.95,1],[8,-3,1.1,0],[-12,-2,0.9,0],
  [10,-11,1.2,0],[5,-14,0.85,0],[-3,-14,1.0,1],[13,-5,1.0,0],[-15,-9,0.95,0],[1,-3,0.8,0]];
spots.forEach(([x,z,s,p]) => tree(x, z, s, !!p));

function rock(x, z, s) {
  const y = H(Math.round(x + half), Math.round(z + half));
  const m = new THREE.Mesh(blobGeo, new THREE.MeshLambertMaterial({ color: M.stone_top, flatShading: true }));
  m.position.set(x, y + s*0.3, z);
  m.scale.set(s*0.6, s*0.45, s*0.7);
  m.rotation.y = s;
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
}
[[16,8,2.6],[18,5,1.7],[14,11,1.2],[-16,12,2.0]].forEach(r => rock(...r));

let frames = 0;
function loop() {
  renderer.render(scene, camera);
  if (++frames >= 3) window.__ready = true;
  requestAnimationFrame(loop);
}
loop();
window.__probe = { renderer, presetName };
</script>
</body>
</html>
