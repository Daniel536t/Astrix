# nginx site for ASTrix on a boxd machine.
# Installed by deploy/boxd/deploy.sh as /etc/nginx/sites-available/astrix.
# boxd terminates TLS and forwards https://<machine>.boxd.sh to port 80.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/astrix/current;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # index.html must never be cached, or players keep an old bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Plain-text health check for uptime monitors.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
